name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify release source and versions
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(<VERSION)
          manifest_version=$(awk -F '"' '$1 == "version = " { print $2 }' herdr-plugin.toml)
          test "${GITHUB_REF_NAME#v}" = "$version"
          test "$manifest_version" = "$version"
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { printf 'Run gofmt on:\n%s\n' "$files"; exit 1; }
      - name: Check shell syntax
        run: sh -n scripts/build.sh scripts/install-release.sh
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/herdr-source-control
      - name: Build release assets
        shell: bash
        run: |
          set -eu
          version=$(<VERSION)
          commit=$(git rev-parse HEAD)
          mkdir dist
          for arch in amd64 arm64; do
            output=herdr-source-control
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commit=$commit" \
              -o "$output" ./cmd/herdr-source-control
            tar -czf "dist/herdr-source-control_${version}_linux_${arch}.tar.gz" "$output"
            rm "$output"
          done
          cd dist
          sha256sum herdr-source-control_*.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
